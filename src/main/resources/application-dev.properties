# Configuration MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/hematrace?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Logs dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.hematrace=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT
jwt.secret=${JWT_SECRET:mySuperSecretKeyForHematraceApplication2024WithMinimum64CharactersLength}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Optionnel uniquement si tu fais vraiment des tests locaux sans sécurité
spring.security.filter.disabled=true
app.frontend.url=http://localhost:4200